<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 60px auto; }
        input { display: block; width: 100%; margin: 6px 0 16px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Add a Book</h1>
    <form method="POST" action="/add">
        <label>Book Title</label>
        <input type="text" name="title" required>

        <label>Author</label>
        <input type="text" name="author" required>

        <label>Rating (0 – 10)</label>
        <input type="number" name="rating" step="0.1" min="0" max="10" required>

        <button type="submit">Add Book</button>
    </form>
    <p><a href="/">← Back to library</a></p>
</body>
</html>
