<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Rating</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 60px auto; }
        input { display: block; width: 100%; margin: 6px 0 16px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #e67e22; color: white; border: none; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Edit Rating</h1>
    <h3>{{ book.title }}</h3>
    <p>by {{ book.author }}</p>
    <form method="POST">
        <label>New Rating (0 – 10)</label>
        <input type="number" name="rating" step="0.1" min="0" max="10" value="{{ book.rating }}" required>
        <button type="submit">Update</button>
    </form>
    <p><a href="/">← Back to library</a></p>
</body>
</html>
